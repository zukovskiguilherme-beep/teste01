<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Clone</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c1d11;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #left-panel {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=600&q=80');
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 4px solid #4a3319;
            text-align: center;
        }
        #counter-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        #cookie-count {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fccc63;
            margin: 0;
        }
        #cps-count {
            font-size: 1.2rem;
            color: #bbb;
            margin: 5px 0 0 0;
        }
        #cookie {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #d4a373 0%, #a98467 70%, #6c584c 100%);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset -10px -10px 20px rgba(0,0,0,0.4);
            transition: transform 0.05s;
        }
        #cookie:active {
            transform: scale(0.95);
        }
        /* Cookie Chocolate Chips */
        .chip {
            position: absolute;
            background-color: #3d2612;
            border-radius: 50%;
        }
        #right-panel {
            width: 350px;
            background: #1e130c;
            display: flex;
            flex-direction: column;
        }
        #shop-header {
            background: #4a3319;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 2px solid #5c4021;
        }
        #upgrades-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .upgrade-item {
            background: #3d2612;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: background 0.2s, border-color 0.2s;
        }
        .upgrade-item:hover {
            background: #4a3319;
        }
        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #23160b;
        }
        .upgrade-info {
            display: flex;
            flex-direction: column;
        }
        .upgrade-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fccc63;
        }
        .upgrade-cost {
            font-size: 0.9rem;
            color: #a98467;
        }
        .upgrade-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: #888;
        }
        .upgrade-item:not(.disabled) .upgrade-cost {
            color: #8cd867;
        }
        /* Floating text animation */
        .floating-text {
            position: absolute;
            color: #fff;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="counter-container">
            <p id="cookie-count">0 cookies</p>
            <p id="cps-count">por segundo: 0</p>
        </div>
        <div id="cookie">
            <!-- Chips generated by JS -->
        </div>
    </div>

    <div id="right-panel">
        <div id="shop-header">Loja de Upgrades</div>
        <div id="upgrades-container">
            <!-- Upgrades generated by JS -->
        </div>
    </div>

    <script>
        let cookies = 0;
        let cookiesPerSecond = 0;

        const upgrades = [
            { id: 'cursor', name: 'Cursor', cost: 15, cps: 0.1, count: 0 },
            { id: 'grandma', name: 'Vovó', cost: 100, cps: 1, count: 0 },
            { id: 'farm', name: 'Fazenda', cost: 1100, cps: 8, count: 0 },
            { id: 'mine', name: 'Mina', cost: 12000, cps: 47, count: 0 },
            { id: 'factory', name: 'Fábrica', cost: 130000, cps: 260, count: 0 }
        ];

        const cookieEl = document.getElementById('cookie');
        const cookieCountEl = document.getElementById('cookie-count');
        const cpsCountEl = document.getElementById('cps-count');
        const upgradesContainer = document.getElementById('upgrades-container');

        // Generate Chocolate Chips visually
        function generateChips() {
            const chipPositions = [
                {t:20, l:40, w:15, h:12}, {t:35, l:70, w:18, h:16}, {t:70, l:25, w:14, h:14},
                {t:60, l:55, w:22, h:18}, {t:80, l:65, w:16, h:12}, {t:45, l:15, w:20, h:15},
                {t:15, l:20, w:12, h:10}, {t:75, l:45, w:15, h:15}
            ];
            chipPositions.forEach(pos => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.style.top = pos.t + '%';
                chip.style.left = pos.l + '%';
                chip.style.width = pos.w + 'px';
                chip.style.height = pos.h + 'px';
                cookieEl.appendChild(chip);
            });
        }

        // Render Shop Items
        function renderShop() {
            upgradesContainer.innerHTML = '';
            upgrades.forEach((up, index) => {
                const item = document.createElement('div');
                item.className = `upgrade-item ${cookies < up.cost ? 'disabled' : ''}`;
                item.onclick = () => buyUpgrade(index);

                item.innerHTML = `
                    <div class="upgrade-info">
                        <span class="upgrade-name">${up.name}</span>
                        <span class="upgrade-cost">Preço: ${Math.floor(up.cost)} c. (+${up.cps} CPS)</span>
                    </div>
                    <span class="upgrade-count">${up.count}</span>
                `;
                upgradesContainer.appendChild(item);
            });
        }

        function updateUI() {
            cookieCountEl.textContent = `${Math.floor(cookies)} cookies`;
            cpsCountEl.textContent = `por segundo: ${cookiesPerSecond.toFixed(1)}`;
            
            // Fast loop to check if buttons should be disabled/enabled
            const items = document.querySelectorAll('.upgrade-item');
            upgrades.forEach((up, i) => {
                if (items[i]) {
                    if (cookies >= up.cost) {
                        items[i].classList.remove('disabled');
                    } else {
                        items[i].classList.add('disabled');
                    }
                }
            });
        }

        // Click Cookie
        cookieEl.addEventListener('click', (e) => {
            cookies += 1;
            createFloatingText(e.clientX, e.clientY, '+1');
            updateUI();
        });

        function createFloatingText(x, y, text) {
            const floating = document.createElement('div');
            floating.className = 'floating-text';
            floating.textContent = text;
            floating.style.left = `${x}px`;
            floating.style.top = `${y}px`;
            document.body.appendChild(floating);
            
            setTimeout(() => {
                floating.remove();
            }, 1000);
        }

        // Buy Upgrade
        function buyUpgrade(index) {
            const up = upgrades[index];
            if (cookies >= up.cost) {
                cookies -= up.cost;
                up.count++;
                up.cost *= 1.15; // Cookie Clicker inflation scale
                calculateCPS();
                renderShop();
                updateUI();
            }
        }

        function calculateCPS() {
            cookiesPerSecond = upgrades.reduce((sum, up) => sum + (up.count * up.cps), 0);
        }

        // Game Loop (Every 100ms for smooth additions)
        setInterval(() => {
            if (cookiesPerSecond > 0) {
                cookies += cookiesPerSecond / 10;
                updateUI();
            }
        }, 100);

        // Initialize
        generateChips();
        renderShop();
        updateUI();
    </script>
</body>
</html>
